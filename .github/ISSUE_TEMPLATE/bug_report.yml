name: Bug report
description: Report a reproducible problem using a sanitized example.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities use the private security report link. Remove secrets and private source before attaching anything."
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, code-viz version or commit, agent and agent version.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command or prompt and a minimal sanitized model or sample.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
      description: Include relevant error output or screenshots.
    validations:
      required: true
