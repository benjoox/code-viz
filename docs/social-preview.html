<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>code-viz social preview</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; width: 1280px; height: 640px; padding: 66px 72px; background: #10131a; color: #e7e9f0; font-family: Arial, sans-serif; }
.brand { font-size: 26px; color: #a5b6ff; letter-spacing: 2px; }

p { font-size: 26px; color: #aeb6c8; line-height: 1.45; }
.flow { display: flex; align-items: center; margin-top: 42px; gap: 22px; }
.node { padding: 20px 28px; border: 1px solid #3c4966; border-radius: 14px; background: #1c2536; font-size: 24px; }
.arrow { color: #7c9bff; font-size: 32px; }
footer { margin-top: 36px; font-size: 20px; color: #98a3bc; }

<div class="brand">code-viz / open source</div>
<h1>See how your<br>code actually flows.</h1>
